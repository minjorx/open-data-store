<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harvest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;max-width:700px;margin:0 auto;padding:20px;font-size:14px;color:#222}
a{color:#0969da;text-decoration:none}
a:hover{text-decoration:underline}
.info{color:#666;font-size:12px}
ul{list-style:none;padding-left:16px}
li{margin:4px 0}
</style>
</head>
<body>
<a href="../" style="font-size:13px">← Back</a>
<h1 style="margin:12px 0 4px">Harvest</h1>
<p style="color:#666;font-size:13px;margin-bottom:16px">Node.js data collection scripts · <a href="https://github.com/minjorx/open-data-store/tree/main/harvest">view on github</a></p>

<ul id="files"></ul>

<script>
const base = 'https://cdn.jsdelivr.net/gh/minjorx/open-data-store/harvest/';
const repo = 'minjorx/open-data-store';

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + 'KB';
  return (bytes / 1024 / 1024).toFixed(1) + 'MB';
}

const r = await fetch(base + 'index.json');
const items = await r.json();
const el = document.getElementById('files');

if (!items.length) {
  el.innerHTML = '<li style="color:#666">(no scripts yet)</li>';
} else {
  items.forEach(f => {
    const li = document.createElement('li');
    if (f.type === 'dir') {
      li.innerHTML = `<a href="https://github.com/${repo}/tree/main/harvest/${f.name}">📁 ${f.name}/</a>`;
    } else {
      li.innerHTML = `<a href="https://raw.githubusercontent.com/${repo}/main/harvest/${f.name}" download>📄 ${f.name}</a>` +
        (f.size ? `<span class="info"> · ${formatSize(f.size)}</span>` : '') +
        ` · <a href="https://github.com/${repo}/blob/main/harvest/${f.name}">src</a>`;
    }
    el.appendChild(li);
  });
}
</script>
</body>
</html>
