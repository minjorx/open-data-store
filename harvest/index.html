<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harvest - File Listing</title>
<style>
body{font-family:system-ui;max-width:800px;margin:40px auto;padding:0 20px}
h1{border-bottom:1px solid #ddd;padding-bottom:10px}
a{display:block;padding:8px 0;color:#333;text-decoration:none}
a:hover{color:#0969da}
.info{color:#666;font-size:14px;margin-top:5px}
.back{color:#0969da;margin-bottom:20px}
</style>
</head>
<body>
<a href="../" class="back">← Back</a>
<h1>Harvest</h1>
<p>Node.js data collection scripts. Download or view source.</p>
<div id="files"></div>
<script>
const repo = 'minjorx/open-data-store';
const path = 'harvest';
async function load() {
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`);
  const files = await r.json();
  const el = document.getElementById('files');
  files.forEach(f => {
    const a = document.createElement('a');
    a.href = `https://raw.githubusercontent.com/${repo}/main/${path}/` + f.name;
    a.innerHTML = `<strong>${f.name}</strong><div class="info">${f.type === 'dir' ? 'directory' : 'file · ' + f.size + ' bytes'} · <a href="https://github.com/${repo}/blob/main/${path}/` + f.name + '">view source</a></div>';
    el.appendChild(a);
  });
}
load();
</script>
</body>
</html>
