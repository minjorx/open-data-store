<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;max-width:700px;margin:0 auto;padding:20px;font-size:14px;color:#222}
a{color:#0969da;text-decoration:none}
a:hover{text-decoration:underline}
.info{color:#666;font-size:12px}
h2{margin:16px 0 6px;font-size:1em;color:#555}
ul{list-style:none;padding-left:16px}
li{margin:4px 0}
li.directory>a{font-weight:500}
.btns{margin-left:6px;font-size:12px;color:#666}
</style>
</head>
<body>
<a href="../" style="font-size:13px">← Back</a>
<h1 style="margin:12px 0 4px">Storage</h1>
<p style="color:#666;font-size:13px;margin-bottom:16px">Data lake + metrics · <a href="https://github.com/minjorx/open-data-store/tree/main/storage">view on github</a></p>
<div id="tree"></div>
<script>
const repo='minjorx/open-data-store';
const base='storage/';

async function fetchDir(path, el, indent=0) {
  let items;
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`);
    items = await r.json();
    if (!Array.isArray(items)) return;
  } catch(e) { return; }

  items.sort((a,b) => (a.type===b.type) ? a.name.localeCompare(b.name) : (a.type==='dir' ? -1 : 1));

  items.forEach(f => {
    const li = document.createElement('li');
    const isDir = f.type === 'dir';
    const indentPx = indent * 16;

    if (isDir) {
      li.className = 'directory';
      li.innerHTML = `<a href="https://github.com/minjorx/open-data-store/tree/main/${f.path}" style="padding-left:${indentPx}px">📁 ${f.name}/</a>` +
        `<span class="btns"> · <a href="https://github.com/minjorx/open-data-store/tree/main/${f.path}">browse</a></span>`;
      el.appendChild(li);
      const subUl = document.createElement('ul');
      li.appendChild(subUl);
      fetchDir(f.path, subUl, indent + 1);
    } else {
      const size = f.size ? f.size + 'B' : '';
      li.innerHTML = `<a href="https://raw.githubusercontent.com/${repo}/main/${f.path}" download style="padding-left:${indentPx}px">📄 ${f.name}</a>` +
        (size ? `<span class="info"> · ${size}</span>` : '') +
        ` · <a href="https://github.com/minjorx/open-data-store/blob/main/${f.path}">src</a>`;
      el.appendChild(li);
    }
  });
}

const tree = document.getElementById('tree');
fetchDir(base, tree);
</script>
</body>
</html>
