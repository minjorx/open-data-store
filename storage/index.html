<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;max-width:700px;margin:0 auto;padding:20px;font-size:14px;color:#222}
a{color:#0969da;text-decoration:none}
a:hover{text-decoration:underline}
.info{color:#666;font-size:12px}
h2{margin:16px 0 6px;font-size:1em;color:#555}
ul{list-style:none;padding-left:16px}
li{margin:4px 0}
li.directory>a{font-weight:500}
</style>
</head>
<body>
<a href="../" style="font-size:13px">← Back</a>
<h1 style="margin:12px 0 4px">Storage</h1>
<p style="color:#666;font-size:13px;margin-bottom:16px">Data lake + metrics · <a href="https://github.com/minjorx/open-data-store/tree/main/storage">view on github</a></p>

<div id="tree"></div>

<script>
const base = 'https://cdn.jsdelivr.net/gh/minjorx/open-data-store/storage/';
const repo = 'minjorx/open-data-store';

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + 'KB';
  return (bytes / 1024 / 1024).toFixed(1) + 'MB';
}

async function loadDir(path, el) {
  const ul = document.createElement('ul');
  el.appendChild(ul);

  const r = await fetch(base + path + 'index.json');
  const items = await r.json();

  items.forEach(f => {
    const li = document.createElement('li');
    if (f.type === 'dir') {
      li.className = 'directory';
      li.innerHTML = `<a href="https://github.com/minjorx/open-data-store/tree/main/storage/${path}${f.name}">📁 ${f.name}/</a>`;
      ul.appendChild(li);
      loadDir(path + f.name + '/', li);  // pass li as new parent (creates nested ul inside it)
    } else {
      li.innerHTML = `<a href="https://raw.githubusercontent.com/${repo}/main/storage/${path}${f.name}" download>📄 ${f.name}</a>` +
        `<span class="info"> · ${formatSize(f.size)}</span>` +
        ` · <a href="https://github.com/${repo}/blob/main/storage/${path}${f.name}">src</a>`;
      ul.appendChild(li);
    }
  });
}

loadDir('', document.getElementById('tree'));
</script>
</body>
</html>
