<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;max-width:700px;margin:0 auto;padding:20px;font-size:14px;color:#222}
a{color:#0969da;text-decoration:none}
a:hover{text-decoration:underline}
.info{color:#666;font-size:12px}
ul{list-style:none;padding-left:16px}
li{margin:3px 0}
li.directory>a{font-weight:500}
.toggle{color:#888;cursor:pointer;margin-right:4px;font-size:12px;user-select:none}
.toggle:hover{color:#0969da}
.nested{display:none}
.expanded>.nested{display:block}
</style>
</head>
<body>
<a href="../" style="font-size:13px">← Back</a>
<h1 style="margin:12px 0 4px">Storage</h1>
<p style="color:#666;font-size:13px;margin-bottom:16px">Data lake + metrics · <a href="https://github.com/minjorx/open-data-store/tree/main/storage">view on github</a></p>

<div id="tree"></div>

<script>
const base = 'https://cdn.jsdelivr.net/gh/minjorx/open-data-store/storage/';
const repo = 'minjorx/open-data-store';
const MAX_DEPTH = 3;

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + 'KB';
  return (bytes / 1024 / 1024).toFixed(1) + 'MB';
}

function toggle(el) {
  el.classList.toggle('expanded');
  const btn = el.querySelector('.toggle');
  btn.textContent = el.classList.contains('expanded') ? '▼' : '▶';
}

async function loadDir(path, parentUl, depth) {
  const r = await fetch(base + path + 'index.json');
  const items = await r.json();

  items.sort((a,b) => (a.type===b.type) ? a.name.localeCompare(b.name) : (a.type==='dir' ? -1 : 1));

  for (const f of items) {
    const li = document.createElement('li');
    if (f.type === 'dir') {
      li.className = 'directory';
      li.innerHTML = `<span class="toggle">▶</span><a href="https://github.com/minjorx/open-data-store/tree/main/storage/${path}${f.name}">📁 ${f.name}/</a>`;
      parentUl.appendChild(li);
      li.querySelector('.toggle').onclick = () => toggle(li);
      const nestedUl = document.createElement('ul');
      nestedUl.className = 'nested';
      li.appendChild(nestedUl);

      if (depth < MAX_DEPTH - 1) {
        li.classList.add('expanded');
        li.querySelector('.toggle').textContent = '▼';
        await loadDir(path + f.name + '/', nestedUl, depth + 1);
      }
    } else {
      li.innerHTML = `<span class="toggle" style="visibility:hidden">▶</span><a href="https://raw.githubusercontent.com/${repo}/main/storage/${path}${f.name}" download>📄 ${f.name}</a>` +
        `<span class="info"> · ${formatSize(f.size)}</span>` +
        ` · <a href="https://github.com/${repo}/blob/main/storage/${path}${f.name}">src</a>`;
      parentUl.appendChild(li);
    }
  }
}

loadDir('', document.getElementById('tree'), 0).catch(() => {
  document.getElementById('tree').innerHTML = '<li style="color:#666">Failed to load</li>';
});
</script>
</body>
</html>
